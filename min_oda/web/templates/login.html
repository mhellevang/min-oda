<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Logg inn – Min Oda</title>
  <style>
    :root {
      --bg: #fafaf8; --card: #fff; --ink: #1a1a1a; --muted: #666;
      --rule: #e5e3df; --accent: #2a6f97; --warn: #d62828; --warn-soft: #fde2e2;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5;
      display: flex; min-height: 100vh; align-items: center; justify-content: center;
    }
    .card {
      background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
      padding: 32px; width: 100%; max-width: 340px; margin: 24px;
    }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input[type=password] {
      width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid var(--rule);
      border-radius: 6px; background: #fff; color: var(--ink);
    }
    input[type=password]:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%; margin-top: 16px; padding: 10px 12px; font-size: 15px;
      background: var(--accent); color: #fff; border: 0; border-radius: 6px; cursor: pointer;
    }
    button:hover { filter: brightness(1.05); }
    .error {
      background: var(--warn-soft); color: var(--warn); border-radius: 6px;
      padding: 8px 12px; font-size: 13px; margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Min Oda</h1>
    <p class="sub">Logg inn for å fortsette.</p>
    {% if error %}<div class="error">Feil passord.</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="password">Passord</label>
    <input type="password" id="password" name="password" autofocus autocomplete="current-password">
    <button type="submit">Logg inn</button>
  </form>
</body>
</html>

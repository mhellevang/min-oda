{% extends "base.html" %}
{% block title %}Restock — Oda-analyse{% endblock %}
{% block content %}
<h1>Restock</h1>
<p class="subtitle">
  Varetyper som snart går tomt basert på hvor ofte du pleier å kjøpe dem.
</p>

<form id="main-form">
  <section>
    <div class="controls">
      <label>Horisont (dager)
        <input type="number" name="horizon" value="{{ horizon }}"
               min="3" max="30" step="1"
               hx-get="/restock/table"
               hx-trigger="input changed delay:300ms"
               hx-include="closest form"
               hx-target="#table-wrap" hx-swap="innerHTML">
      </label>
      <label>Søk
        <input type="text" name="search" value="{{ search }}"
               placeholder="varetype, produkt, kategori"
               hx-get="/restock/table"
               hx-trigger="keyup changed delay:300ms"
               hx-include="closest form"
               hx-target="#table-wrap" hx-swap="innerHTML">
      </label>
    </div>
    <label class="checkbox-row">
      <input type="checkbox" name="show_all" value="true"
             {% if show_all %}checked{% endif %}
             hx-get="/restock/table"
             hx-trigger="change"
             hx-include="closest form"
             hx-target="#table-wrap" hx-swap="innerHTML">
      Vis alle (også <em>i rute</em>)
    </label>
    <label class="checkbox-row">
      <input type="checkbox" name="by_type" value="true"
             {% if by_type %}checked{% endif %}
             hx-get="/restock/table"
             hx-trigger="change"
             hx-include="closest form"
             hx-target="#table-wrap" hx-swap="innerHTML">
      Grupper per varetype <span class="muted">(behandler alle melk som én vare uansett merke)</span>
    </label>
  </section>

  <section>
    <div id="table-wrap">
      {% include "_restock_table.html" %}
    </div>
  </section>
</form>
{% endblock %}

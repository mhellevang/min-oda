{% if rows %}
<table>
  <thead>
    <tr>
      <th>Kategori</th>
      <th>Varetype</th>
      <th>Produkt</th>
      <th class="num">Antall</th>
      <th class="num">Kadens</th>
      <th>Sist kjøpt</th>
    </tr>
  </thead>
  <tbody>
    {% for r in rows %}
    <tr>
      <td class="muted">{{ r.category }}</td>
      <td>{{ r.key }}</td>
      <td>{{ r.product_name }}</td>
      <td class="num">
        <input type="number" class="qty" name="qty_{{ r.product_id }}"
               value="{{ r.qty }}" min="0" step="1">
      </td>
      <td class="num muted nowrap">hver {{ r.median }}. d</td>
      <td class="muted nowrap">{{ r.last }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
<p class="muted" style="font-size: 12px; margin-top: 10px;">
  {{ rows | length }} varetyper · sett antall til 0 for å droppe en vare.
</p>
{% else %}
<p class="muted">Ingen treff.</p>
{% endif %}

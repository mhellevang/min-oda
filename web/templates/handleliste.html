{% extends "base.html" %}
{% block title %}Handleliste — Oda-analyse{% endblock %}
{% block content %}
<h1>Handleliste</h1>
<p class="subtitle">
  Forslag basert på dine faste varer. Endre antallet for hver vare i tabellen
  (sett 0 for å droppe), så opprett listen på Oda.
</p>

<form id="main-form"
      hx-post="/handleliste/create"
      hx-target="#result"
      hx-swap="innerHTML">

  <section>
    <div class="controls">
      <label>Syklus (dager)
        <input type="number" name="cycle" value="{{ cycle }}"
               min="7" max="28" step="1"
               hx-get="/handleliste/table"
               hx-trigger="input changed delay:300ms"
               hx-include="closest form"
               hx-target="#table-wrap"
               hx-swap="innerHTML">
      </label>
      <label>Maks varetyper
        <input type="number" name="top" value="{{ top }}"
               min="20" max="120" step="5"
               hx-get="/handleliste/table"
               hx-trigger="input changed delay:300ms"
               hx-include="closest form"
               hx-target="#table-wrap"
               hx-swap="innerHTML">
      </label>
      <label>Maks per kategori
        <input type="number" name="max_per_cat" value="{{ max_per_cat }}"
               min="4" max="20" step="1"
               hx-get="/handleliste/table"
               hx-trigger="input changed delay:300ms"
               hx-include="closest form"
               hx-target="#table-wrap"
               hx-swap="innerHTML">
      </label>
      <label>Søk
        <input type="text" name="search" value="{{ search }}"
               placeholder="varetype, produkt, kategori"
               hx-get="/handleliste/table"
               hx-trigger="keyup changed delay:300ms"
               hx-include="closest form"
               hx-target="#table-wrap"
               hx-swap="innerHTML">
      </label>
    </div>
  </section>

  <section>
    <div id="table-wrap">
      {% include "_list_table.html" %}
    </div>

    <div class="create-row">
      <input type="text" name="title" value="Ukehandel — familien" required
             aria-label="Listetittel">
      <button type="submit" class="primary">📤 Opprett liste på Oda</button>
    </div>
    <div id="result"></div>
  </section>
</form>
{% endblock %}

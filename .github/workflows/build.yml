name: Build image

# Push til main: bygg imaget og push til GHCR. På PR-er: bygg kun (verifiser,
# ingen push). Deploy-målet (TrueNAS SCALE) henter imaget selv via Watchtower,
# se DEPLOY.md. Ingenting deployes over SSH fra CI, ingen app-hemmeligheter i CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]      # bygg (uten push) på PR-er for å verifisere før merge
  workflow_dispatch: {}   # tillat manuell "Run workflow" også

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mhellevang/min-oda

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push til GHCR med den innebygde GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'   # kun nødvendig for push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}   # PR-er bygger kun, pusher ikke
          platforms: linux/amd64   # TrueNAS SCALE er x86_64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

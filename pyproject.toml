[project]
name = "min-oda"
version = "0.1.0"
description = "Hent, analyser og bygg handleliste fra din egen handlehistorikk på oda.com"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.28",
    "rookiepy>=0.5.6",
]

[project.scripts]
min-oda = "min_oda.web.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["min_oda"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
